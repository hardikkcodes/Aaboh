limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

# Keep https when TLS ends at a hosting proxy in front of this server.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Four 5 MB images plus the form fields.
    client_max_body_size 21m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    proxy_http_version 1.1;
    # $http_host keeps a non-default port, so image URLs built by Django work.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # API, schema, admin and static admin files are served by Django.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;
    }

    # Requests carry a resident's position, so they stay out of access logs.
    location = /api/v1/locations/nearest/ {
        access_log off;
        proxy_pass http://backend:8000;
    }

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Uploaded images are re-encoded by Django and shared through a read-only volume.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
    }

    # Long-lived hashed assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Must never be cached, or a new release can't replace it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    # Client-side routing: unknown paths return the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
